name: Orbfall API Tests
on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]
  workflow_dispatch:

jobs:
  unit-tests:
    name: Run Python Unit Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/unit/dependencies.txt

      - name: Run API tests
        run: |
          pytest tests/unit/test_orbfall_api.py

      - name: Run Unit tests
        run: |
          pytest tests/unit/ -v